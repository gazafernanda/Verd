services:
  - type: web
    name: verd-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Verd.Api/Dockerfile
    dockerContext: ./Verd.Api
    autoDeploy: true
    envVars:
      # Neon Postgres connection string — set manually in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Groq API key for the AI chat/recommendations — set manually.
      - key: GROQ_API_KEY
        sync: false
      # OAuth web-client ID. Set this in Render; without it the API deliberately
      # reports Google sign-in as disabled and the frontend hides the button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # JWT signing secret — Render generates a strong random value on first deploy.
      - key: Jwt__Secret
        generateValue: true
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Public application address used in verification and password-reset links.
      - key: APP_BASE_URL
        value: https://gazafernanda.github.io/Verd
      # HTTPS email APIs work on Render's free plan, unlike SMTP ports.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
      # Disables the appsettings.json FileSystemWatcher — the container's
      # inotify instance limit was being hit on startup, crash-looping the service.
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
